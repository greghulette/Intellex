<!doctype html>
<meta charset="utf-8">
<title>Intellex</title>
<!-- Only ever seen under --browser; a pywebview window has no tab. Cheap, and
     the alternative is Chrome's blank-page glyph on a page that has a logo. -->
<link rel="icon" href="/_assets/intellex-favicon-32.png">
<style>
  /* --accent IS the mark's ring colour (#4aa6ef), not a colour picked to look
     like it. The wordmark's LEX sits inches from the ring in the masthead, so
     any drift between the two reads as a rendering fault. */
  :root { color-scheme: dark; --bg:#12131a; --panel:#1b1d27; --line:#2c2f3d;
          --fg:#e8e8ea; --muted:#8b8fa3; --accent:#4aa6ef; --ok:#4ec9a0; --warn:#e0a458; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif; padding:22px 24px; }
  .masthead { display:flex; align-items:center; gap:12px; margin-bottom:18px; }
  /* flex:none, or the image is a shrinkable flex child and squashes when the
     text beside it wants the room. */
  .masthead .mark { flex:none; width:40px; height:40px; display:block; }
  /* Set in caps with the wordmark's own 0.10em tracking. The drawn wordmark is
     Chakra Petch, which this app does not ship and cannot fetch offline, so the
     brand is carried by the case, the tracking and the INTEL/LEX colour split
     rather than by the typeface. */
  h1 { font-size:20px; margin:0 0 1px; letter-spacing:.1em; font-weight:600; }
  h1 span { color:var(--accent); }
  .sub { color:var(--muted); font-size:12.5px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px;
          padding:14px 16px; margin-bottom:12px; }
  .card h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em;
             color:var(--muted); margin:0 0 10px; font-weight:600; }
  .row { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:7px;
         cursor:pointer; border:1px solid transparent; }
  .row:hover { background:#232636; border-color:var(--line); }
  .row .name { flex:1; min-width:0; }
  .row .name b { display:block; }
  .row .name small { color:var(--muted); }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--muted); flex:none; }
  .dot.up { background:var(--ok); }
  .empty { color:var(--muted); font-size:12.5px; padding:6px 10px; }
  button { font:inherit; background:#273044; color:var(--fg); border:1px solid var(--line);
           border-radius:7px; padding:7px 13px; cursor:pointer; }
  button:hover { background:#313c55; }
  button.primary { background:var(--accent); color:#0d1117; border-color:var(--accent); font-weight:600; }
  button:disabled { opacity:.5; cursor:default; }
  button.pick[aria-pressed="true"] { background:var(--accent); color:#0d1117;
                                     border-color:var(--accent); font-weight:600; }
  .bar { display:flex; gap:8px; align-items:center; }
  .bar .grow { flex:1; }
  .status { font-size:12.5px; color:var(--muted); min-height:18px; margin-top:10px; }
  .status.err { color:#e5737b; }
  .stale { color:var(--warn); }
  h1 #appver { font-size:11.5px; font-weight:400; color:var(--muted); letter-spacing:0; }
  input { font:inherit; background:#12131a; color:var(--fg); border:1px solid var(--line);
          border-radius:6px; padding:4px 8px; margin-left:4px; }
  details#maint { margin-top:4px; }
  details#maint > summary {
    cursor:pointer; list-style:none; color:var(--muted); font-size:12.5px;
    padding:8px 10px; border:1px solid var(--line); border-radius:8px;
    background:var(--panel); user-select:none;
  }
  details#maint > summary::-webkit-details-marker { display:none; }
  details#maint > summary::before { content:'B8'; margin-right:7px; display:inline-block; }
  details#maint[open] > summary::before { transform:rotate(90deg); }
  details#maint > summary:hover { background:#232636; }
</style>

<header class="masthead">
  <!-- alt="" on purpose: the <h1> beside it already says the name, so alt text
       here would just make a screen reader announce "Intellex" twice. -->
  <!-- THE 128px RASTER, NOT intellex-mark.svg. Every .svg in the design set has
       an <image> element carrying no href at all, so the R2 in the middle of
       the housing simply does not draw -- ring and hexagon render, the centre
       comes out empty, and it looks like a deliberately hollow logo rather than
       a broken file. The PNG builds are complete. Displayed at 40, sourced at
       128 so a 2x or 3x screen has real pixels to use. -->
  <img class="mark" src="/_assets/intellex-mark-128.png" alt="" width="40" height="40">
  <div>
    <h1>INTEL<span>LEX</span> <span id="appver"></span></h1>
    <div class="sub">Pick a droid, or a cable.</div>
  </div>
</header>

<div class="card">
  <h2>Over WiFi</h2>
  <div id="wifi"><div class="empty">scanning…</div></div>
</div>

<div class="card">
  <h2>Over USB</h2>
  <div id="serial"><div class="empty">looking for ports…</div></div>
</div>

<!-- The layout choice is a preference, not a per-launch decision — it is
     remembered. One row, no card, no explanatory paragraph: the labels say what
     they do and the note only appears on hover. -->
<div class="bar" id="openwith" style="margin:14px 2px 16px">
  <span style="color:var(--muted);font-size:12.5px;margin-right:2px">Open with</span>
  <button class="pick" data-view="nc"    title="The droid config tool, full window.">NaviCore tool</button>
  <button class="pick" data-view="wcb"   title="The WCB config tool, full window. Reaches WCBs over USB, or through a relay over WiFi.">WCB</button>
  <button class="pick" data-view="split" title="Both tools in one window, with a draggable divider. Both stay connected.">Side by side</button>
  <button class="pick" data-view="sep"   title="The config tool here, the Wizard in its own window.">Separate windows</button>
  <span class="grow"></span>
  <button id="rescan">Rescan</button>
  <button id="offline">Open the tool anyway</button>
  <button id="back" class="primary" style="display:none">Back to tool</button>
</div>

<!-- ── Everything you touch occasionally, folded away ────────────────────────
     Versions, the firmware cache, the branch and the log are maintenance. They
     were four stacked cards competing with the one thing this screen is for, so
     they collapse to a single line.

     THE SUMMARY MUST SURFACE PROBLEMS. Collapsing is only acceptable if nothing
     that needs attention hides behind it — a stale tool, an uncached firmware
     set, a branch that is not main. Those turn the line orange and it opens
     itself, so folding never costs you a warning. -->
<details id="maint">
  <summary id="maint-sum">Updates, firmware and logs</summary>
  <div class="card" style="margin-top:8px">
    <div class="bar">
      <span class="grow" id="uiver">checking…</span>
      <button id="update">Update tools</button>
    </div>
    <div class="bar" style="margin-top:12px">
      <span class="grow" id="fwver">checking…</span>
      <button id="updatefw" title="Download every firmware image now, so flashing works later with no internet">Update firmware</button>
    </div>
    <div class="empty" style="padding-left:0">
      Firmware is cached locally so you can flash with no internet — get everything
      current here, then disconnect and join the droid's AP.
    </div>
    <div class="bar" style="margin-top:10px">
      <span style="color:var(--muted);font-size:12.5px">Branch</span>
      <label style="font-size:12.5px">NaviCore
        <input id="br-nc" size="12" spellcheck="false"></label>
      <label style="font-size:12.5px">WCB
        <input id="br-wcb" size="12" spellcheck="false"></label>
      <button id="br-save">Set</button>
      <span class="grow" id="br-note"></span>
    </div>
    <div class="bar" style="margin-top:12px">
      <span class="grow" id="logpath" style="font-size:12px;color:var(--muted);
            overflow:hidden;text-overflow:ellipsis;white-space:nowrap">…</span>
      <button id="showlog">Show log</button>
    </div>
    <pre id="logtail" style="display:none;max-height:240px;overflow:auto;margin:8px 0 0;
         padding:10px;background:#0e0f16;border:1px solid var(--line);border-radius:7px;
         font:11.5px/1.45 ui-monospace,Consolas,monospace;white-space:pre-wrap"></pre>
  </div>
</details>

<div class="status" id="status"></div>

<script>
// F5 / Ctrl+R: the window has no browser chrome, so the usual reload keys are
// dead. This page is served no-store, so a reload picks up edits immediately.
addEventListener('keydown', e => {
  if (e.key === 'F5' || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'r')) {
    e.preventDefault(); location.reload();
  }
});

const $ = id => document.getElementById(id);
const setStatus = (t, err) => { const s=$('status'); s.textContent=t; s.className='status'+(err?' err':''); };

// ── The collapsed summary ───────────────────────────────────────────────────
// Folding maintenance away is only acceptable if nothing needing attention hides
// behind it. Each check reports its state here; anything wrong turns the line
// orange AND opens the section, so a stale tool, an uncached firmware set or a
// non-main branch can never be missed by having collapsed it.
const _maint = { tools: '', fw: '', branch: '' };
function paintMaint() {
  const bad = Object.values(_maint).filter(Boolean);
  const sum = $('maint-sum');
  if (bad.length) {
    sum.innerHTML = 'Updates, firmware and logs &nbsp;·&nbsp; <span class="stale">'
                  + bad.join(' · ') + '</span>';
    // Open it once, not on every refresh — reopening a section the user has
    // deliberately closed is the kind of helpfulness nobody wants.
    if (!$('maint').dataset.nagged) {
      $('maint').open = true;
      $('maint').dataset.nagged = '1';
    }
  } else {
    sum.textContent = 'Updates, firmware and logs · all current';
  }
}


async function api(path, opts) {
  const r = await fetch(path, opts);
  return r.json();
}

function row(dot, title, sub, onclick) {
  const d = document.createElement('div');
  d.className = 'row';
  d.innerHTML = `<span class="dot${dot ? ' up' : ''}"></span>
                 <span class="name"><b></b><small></small></span>`;
  d.querySelector('b').textContent = title;
  d.querySelector('small').textContent = sub;
  d.onclick = onclick;
  return d;
}

// ── Which tool(s) to open, and how ──────────────────────────────────────────
// Four ways to arrange two tools, and no one of them is right for everyone: the
// config tool alone is the common case, the Wizard alone is the WCB-only case,
// side by side is what the relay makes newly worth doing (one mesh, two views),
// and separate windows is the only answer on two monitors.
//
// Remembered, because it is a working style rather than a per-session decision —
// having to re-pick it on every launch would be the annoying half of offering it.
const VIEW_KEY = 'intellex_view';
const VIEWS = {
  nc:    { label: 'NaviCore tool',    note: 'The droid config tool, full window.' },
  wcb:   { label: 'WCB',              note: 'The WCB config tool, full window. Reaches WCBs over USB, '
                                          + 'or through a management relay over WiFi.' },
  split: { label: 'Side by side',     note: 'Both tools in one window, with a draggable divider. '
                                          + 'Both stay connected — the host feeds them the same link.' },
  sep:   { label: 'Separate windows', note: 'The config tool here, the Wizard in its own window.' },
};

function currentView() {
  try {
    const v = localStorage.getItem(VIEW_KEY);
    if (v && VIEWS[v]) return v;
  } catch (_) {}
  return 'nc';
}

function paintView() {
  const cur = currentView();
  for (const b of document.querySelectorAll('.pick'))
    b.setAttribute('aria-pressed', String(b.dataset.view === cur));
  // The per-view description now lives on each button's title rather than a
  // paragraph under the row. Guarded because this runs at parse time: throwing
  // here aborts the rest of the script, which is exactly what happened when the
  // element went away -- every later check silently never ran.
  const note = $('viewnote');
  if (note) note.textContent = VIEWS[cur].note;
}

for (const b of document.querySelectorAll('.pick')) {
  b.onclick = () => {
    try { localStorage.setItem(VIEW_KEY, b.dataset.view); } catch (_) {}
    paintView();
  };
}
paintView();

// Where "open the tool" actually goes. The shell handles nc/wcb/split itself;
// "sep" opens the config tool here and asks the host for a second window for the
// Wizard — falling back to a plain tab if there is no window backend, which is
// the normal case under --browser.
// Inside the shell's chooser overlay, "open the tool" means DISMISS THE OVERLAY —
// the tools are already loaded and running behind it. Navigating this frame to
// /_shell would nest a whole second shell inside the first, and reloading the top
// window would throw away the very state the overlay exists to preserve (every
// board's pulled config, which through a relay is a slow sequential re-pull).
const IN_SHELL = (() => { try { return window.parent !== window; } catch (_) { return false; } })();
function backToTools() {
  window.parent.postMessage({ intellex: 'close-chooser' }, location.origin);
}

// The layout picker is the SHELL's job once the shell exists — its tabs and its
// side-by-side toggle already do this live, with no reload. A second control for
// the same thing here, whose only way to take effect is the page reload this
// overlay exists to avoid, is worse than no control.
if (IN_SHELL) $('openwith').style.display = 'none';

async function openTools() {
  if (IN_SHELL) { backToTools(); return; }
  const view = currentView();
  if (view === 'sep') {
    let opened = false;
    try {
      const r = await fetch('/_api/open-window', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ url: '/wcb/Wizard/', title: 'WCB Wizard' }),
      });
      opened = !!(await r.json().catch(() => ({}))).ok;
    } catch (_) {}
    if (!opened) window.open('/wcb/Wizard/', '_blank');
    location.href = '/';
    return;
  }
  location.href = '/_shell?view=' + view;
}

async function connect(body, label) {
  setStatus('connecting to ' + label + '…');
  const r = await api('/_api/attach', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body),
  });
  if (!r.ok) { setStatus(r.error || 'could not connect', true); return; }
  setStatus('connected — opening ' + VIEWS[currentView()].label + '…');
  // Straight to the tool(s). The shim in each auto-connects to what we just attached.
  openTools();
}

// ── Keep looking while a droid is still coming up ─────────────────────────
// This page used to scan exactly ONCE, on load. A NaviCore that is merely still
// BOOTING -- its AP up and answering ping, but its WS endpoint not started yet --
// therefore rendered as "routed via 192.168.4.2 but no TCP ... the AP is down"
// and STAYED that way, because nothing ever looked again. The board finished
// coming up a few seconds later and the page never noticed; the only way out was
// to know the Rescan button existed. That is a bad first impression of a board
// that is working perfectly.
//
// So keep watching -- but ONLY in that exact state: a candidate that is routable
// and not yet answering. Deliberately NOT "whenever nothing was found", because a
// machine with no droid on WiFi at all would then probe forever for something
// that is never coming.
//
// Only the WiFi panel is redrawn, so the serial list does not flicker or move
// under the cursor while someone is reaching for it.
const WATCH_EVERY_MS = 4000;
const WATCH_FOR_MS   = 120000;   // not booting any more, just broken
let watchTimer = null, watchUntil = 0;

// Returns true while something is there but not yet answering — i.e. worth
// another look.
async function scanWifi() {
  let comingUp = false;
  try {
    const { candidates } = await api('/_api/discover');
    const el = $('wifi'); el.innerHTML = '';

    // WHICH NETWORK ARE WE ON? It decides what to re-associate after a drop, and
    // the address alone cannot tell us: the relay holds 192.168.4.19 whether it is
    // hosting the AP itself or has joined NaviCore's. Seeing a NaviCore at .1 too
    // means we are on NaviCore's network; seeing only a doorway means we are on
    // that box's own AP — and which box it is decides the name, since all three
    // firmwares derive "<prefix>-<id>" from a DIFFERENT prefix: NaviCore-<id>,
    // MgmtRelay-<id>, WCB-<alias|number> (WCB_WiFi.cpp wcbWifiDefaultSsid). The
    // bounce matches on that prefix, so passing the wrong one means it hunts for
    // a network that does not exist and reports the adapter as unassociated.
    const sawCore = candidates.some(c => c.isNaviCore);
    const ssidFor = c => sawCore ? 'NaviCore' : (c.isWcb ? 'WCB' : 'MgmtRelay');

    for (const c of candidates) {
      if (c.isNaviCore) {
        el.appendChild(row(true, `NaviCore at ${c.host}`,
          `${c.version} · direct · via ${c.via}`,
          () => connect({kind:'ws', host:c.host, role:'navicore', ssid:'NaviCore'}, c.host)));
      } else if (c.isMesh) {
        // A doorway to the mesh — either a MgmtRelay or a WCB hosting its own AP.
        // Same row either way, because the decision the user is making is the
        // same one: what can I reach through this. Only the noun differs, and it
        // has to be RIGHT — a WCB labelled "Mgmt relay" sends someone looking for
        // a board they did not flash.
        //
        // Neither is a second, equivalent droid, so say what is behind it rather
        // than leaving it looking like one. "A bridge" is abstract; "sees NaviCore
        // v0.2.0_…" is the thing you are actually deciding about.
        const isWcb  = c.isWcb;
        const who    = c.alias || (isWcb ? 'WCB' : 'Mgmt relay');
        const what   = isWcb ? 'a WCB, and the way to the mesh' : 'bridges to the mesh';
        // Don't render "Vader WCB · WCB #21" — the alias usually says it already.
        const idTag  = !c.relayId ? ''
                     : (isWcb && /wcb/i.test(who) ? ` · #${c.relayId}`
                                                  : ` · WCB #${c.relayId}`);
        const behind = (c.peers || []).filter(p => p.alias)
          .map(p => p.alias + (p.fw ? ' ' + p.fw : '')).join(', ');
        el.appendChild(row(true, `${who} at ${c.host}`,
          what + idTag + (behind ? ` · sees ${behind}` : ' · no boards seen yet'),
          // relayId rides along: the Wizard files a doorway under its DEVICE_ID
          // rather than the slot it lands on, and needs the number to route the
          // mesh boards through it. Discovery already read it from the WDP
          // self-row, so pass it on rather than making the page rediscover it.
          () => connect({kind:'ws', host:c.host, role: isWcb ? 'wcb' : 'relay',
                         ssid: ssidFor(c),
                         relayId: c.relayId ? parseInt(c.relayId) : undefined}, c.host)));
      } else if (c.routable) {
        // The adapter is fine and something IS there — very likely a board
        // mid-boot, so tell watchForDroid() to keep looking.
        comingUp = true;
      }
    }

    if (!el.children.length) {
      // ONE explanation, from the most informative candidate. Two probes means two
      // hints, and a wall of them reads as two separate faults rather than one
      // situation. Still says it is watching, or it reads as a verdict rather than
      // a snapshot.
      const best = candidates.find(c => c.reachable) || candidates.find(c => c.routable)
                || candidates[0];
      const d = document.createElement('div');
      d.className = 'empty';
      d.textContent = best
        ? best.hint + (best.routable && Date.now() < watchUntil ? ' — still watching…' : '')
        : 'no droid found';
      el.appendChild(d);
    }
  } catch (e) {
    $('wifi').innerHTML = '<div class="empty">scan failed</div>';
  }
  return comingUp;
}

function watchForDroid() {
  clearTimeout(watchTimer);
  if (Date.now() >= watchUntil) { scanWifi(); return; }   // final pass, plain text
  watchTimer = setTimeout(async () => {
    if (await scanWifi()) watchForDroid();
    else offerOfflineIfEmpty();
  }, WATCH_EVERY_MS);
}

async function scan() {
  $('wifi').innerHTML = '<div class="empty">scanning…</div>';
  $('serial').innerHTML = '<div class="empty">looking for ports…</div>';

  // Serial first — it is instant, so the window never looks frozen while the
  // network probe runs.
  try {
    const { ports } = await api('/_api/ports');
    const el = $('serial'); el.innerHTML = '';
    // SAY WHAT THE DESCRIPTOR ACTUALLY PROVES, WHICH IS THE CHIP.
    //
    // The old version guessed a PRODUCT from the descriptor and was wrong half the
    // time on a normal bench: a NaviCore and an SBUS controller are the same
    // silicon (ESP32-S3, native USB CDC) and enumerate identically as 303A:1001
    // "USB Serial Device", so both were labelled "probably a NaviCore"; and a
    // generic ESP32 dev board running the mgmt relay shows a CP210x, so it was
    // labelled "probably a WCB bridge".
    //
    // The VID is reliable for what it says, so use it and stop there. The real
    // identity comes from identify() below, which ASKS.
    const chipLabel = p => {
      switch (p.vid) {
        case 0x303A: return 'Espressif native USB';
        case 0x1A86: return 'CH9102 bridge';
        case 0x10C4: return 'CP210x bridge';
        case 0x0403: return 'FTDI bridge';
        default:     return p.description || 'serial port';
      }
    };
    // Only native-USB Espressif ports can be a NaviCore (the build is
    // USBMode=hwcdc / CDCOnBoot=cdc, so it never appears behind a bridge chip).
    // Probing just those keeps the WCB and the relay untouched.
    const worthAsking = p => p.vid === 0x303A;
    // Never the droid, on either platform: Bluetooth virtual ports, and macOS's
    // built-in debug/console serial devices.
    //
    // /dev/tty.* is skipped too. macOS exposes every serial device twice -- cu.*
    // (call-out) and tty.* (dial-in) -- and opening the tty. side BLOCKS until
    // carrier detect, which a USB CDC device never asserts. Picking one hangs the
    // connect with no error and no timeout, which reads as "the app is frozen".
    // pyserial lists both, so the chooser has to be the thing that hides one.
    const skip = p => /Bluetooth|\/dev\/tty\.|\/dev\/cu\.(debug|Bluetooth|wlan)/i.test(`${p.path} ${p.description || ''}`);
    if (!ports.length) el.innerHTML = '<div class="empty">no serial ports found</div>';
    const asking = [];
    for (const p of ports) {
      if (skip(p)) continue;
      const r = row(false, p.path, chipLabel(p),
        () => connect({kind:'serial', port:p.path}, p.path));
      el.appendChild(r);
      if (worthAsking(p)) asking.push([p, r]);
    }
    if (!el.children.length) el.innerHTML = '<div class="empty">no likely ports found</div>';

    // Render first, ASK second. Enumerating ports is instant; opening one and
    // waiting for a reply is not, and a chooser that stalls for seconds on launch
    // looks broken. So the honest chip label goes up immediately and upgrades in
    // place if the board answers.
    for (const [p, r] of asking) {
      const sub = r.querySelector('small');
      sub.textContent = chipLabel(p) + ' — asking…';
      api('/_api/identify', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({port: p.path}),
      }).then(res => {
        if (res.attached) { sub.textContent = 'connected right now'; r.querySelector('.dot').classList.add('up'); return; }
        if (res.ok && res.version) {
          sub.textContent = 'NaviCore ' + res.version;
          r.querySelector('.dot').classList.add('up');
        } else if (res.busy) {
          // Actionable, and a different problem entirely: the board may well be a
          // NaviCore, we just could not ask it.
          sub.textContent = chipLabel(p) + ' — in use by another program';
        } else {
          // No PONG. An SBUS controller, or any other Espressif board — all we
          // honestly know is that it did not answer as a droid.
          sub.textContent = chipLabel(p) + ' — did not answer as a NaviCore';
        }
      }).catch(() => { sub.textContent = chipLabel(p); });
    }
  } catch (e) { $('serial').innerHTML = '<div class="empty">could not list ports</div>'; }

  clearTimeout(watchTimer);
  watchUntil = Date.now() + WATCH_FOR_MS;
  if (await scanWifi()) watchForDroid();

  offerOfflineIfEmpty();
}

// One line per bundled tool. Both age independently — they come from different
// repos with different release cadences — so a single combined verdict would hide
// whichever one happens to be current behind whichever one is not.
function uiLine(name, v) {
  if (!v || !v.bundled) return `no ${name} bundled`;
  if (!v.checked) {
    // "offline" was the only story this told, and on a stock macOS Python it was
    // the wrong one — the box was online and simply could not verify a
    // certificate. Show the first line, keep the fix in the tooltip.
    const why = (v.reason || '').split('\n')[0].trim();
    return `${name} ${v.bundled} — ${why ? 'cannot compare: ' + why : 'offline, cannot compare'}`;
  }
  if (v.stale) return `${name} <b>${v.bundled}</b> — <span class="stale">update available (${v.published})</span>`;
  return `${name} ${v.bundled} — up to date`;
}

async function checkUi() {
  try {
    const v = await api('/_api/webui-version');
    // wcb is absent when an OLD host serves this NEW page — a Intellex left
    // running across an update. Treat it as "not bundled" rather than throwing,
    // which would blank the NaviCore line too and hide both answers at once.
    const w = v.wcb || null;
    $('uiver').innerHTML = uiLine('config tool', v)
                         + '<br>' + uiLine('WCB Wizard', w);
    $('uiver').title = [v.reason, w && w.reason].filter(Boolean).join('\n\n');
    const stale = [v.stale && 'config tool', w && w.stale && 'Wizard'].filter(Boolean);
    _maint.tools = stale.length ? stale.join(' + ') + ' update available' : '';
    paintMaint();
  } catch (e) {
    $('uiver').textContent = 'could not check the tool versions';
    _maint.tools = ''; paintMaint();
  }
}

// ── The firmware cache ──────────────────────────────────────────────────────
// Shown because the whole point is knowing what you are CARRYING before you walk
// away from the network. "It will download when I flash" is exactly the
// assumption that fails on a droid's AP, where there is no route to GitHub.
async function checkFw() {
  try {
    const f = await api('/_api/firmware');
    const bits = [];
    for (const [k, label] of [['navicore', 'NaviCore'], ['wcb', 'WCB']]) {
      const i = f[k] || {};
      bits.push(i.count ? `${label} ${i.newest || i.count + ' files'}`
                        : `${label} <span class="stale">not cached</span>`);
    }
    $('fwver').innerHTML = 'firmware cached: ' + bits.join(' &nbsp;·&nbsp; ');
    const missing = [];
    for (const [k, label] of [['navicore', 'NaviCore'], ['wcb', 'WCB']])
      if (!(f[k] || {}).count) missing.push(label);
    _maint.fw = missing.length ? missing.join(' + ') + ' firmware not cached' : '';
    paintMaint();
  } catch (e) {
    $('fwver').textContent = 'could not read the firmware cache';
    _maint.fw = ''; paintMaint();
  }
}
checkFw();

$('updatefw').onclick = async () => {
  $('updatefw').disabled = true;
  setStatus('downloading firmware for offline use — this can take a minute…');
  try {
    const r = await api('/_api/update-firmware', {method: 'POST'});
    // Partial success is real: a cached NaviCore set is still worth having when
    // the WCB fetch was rate-limited, so report what landed either way.
    setStatus(r.ok ? 'firmware cached — safe to go offline now'
                   : ('firmware update incomplete: ' + (r.error || 'see the log')), !r.ok);
  } catch (e) { setStatus('firmware update failed: ' + e.message, true); }
  $('updatefw').disabled = false;
  checkFw();
};

// ── The log ─────────────────────────────────────────────────────────────────
// The app is windowed, so everything the host prints goes nowhere a user can
// see. This is the only way to read it without a terminal — which matters
// because the app's normal launch (Start Menu, or the .exe) has no console at
// all, and that is the build people actually run.
async function checkLog() {
  try {
    const l = await api('/_api/log');
    $('logpath').textContent = l.path ? ('log: ' + l.path) : ('logs in ' + l.dir);
  } catch (e) { $('logpath').textContent = 'log location unavailable'; }
}
checkLog();

// ── Firmware branch, per product ────────────────────────────────────────────
// CI publishes binaries per branch, so a feature branch has a real flashable
// build — and working on one while unable to flash it is the whole problem this
// solves. Per product because a WCB feature branch alongside released NaviCore
// firmware is the normal case.
//
// A non-main branch is called out in ORANGE, deliberately. Flashing a branch
// build is a thing you should only ever do on purpose, and a setting that
// persists silently is exactly how you end up flashing one months later without
// remembering you set it.
async function checkBranches() {
  try {
    const b = await api('/_api/branches');
    $('br-nc').value = b.navicore || 'main';
    $('br-wcb').value = b.wcb || 'main';
    const off = [];
    if ((b.navicore || 'main') !== 'main') off.push('NaviCore → ' + b.navicore);
    if ((b.wcb || 'main') !== 'main') off.push('WCB → ' + b.wcb);
    $('br-note').innerHTML = off.length
      ? '<span class="stale">not on main: ' + off.join(', ') + '</span>'
      : '';
    _maint.branch = off.length ? off.join(', ') : '';
    paintMaint();
  } catch (e) {
    $('br-note').textContent = 'could not read the branch setting';
    _maint.branch = ''; paintMaint();
  }
}
checkBranches();

$('br-save').onclick = async () => {
  $('br-save').disabled = true;
  try {
    for (const [product, id] of [['navicore', 'br-nc'], ['wcb', 'br-wcb']]) {
      const r = await api('/_api/branch', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ product, branch: $(id).value.trim() }),
      });
      if (!r.ok) { setStatus(r.error || 'could not set the branch', true); break; }
    }
    // The cache still holds whatever was fetched before, and its filenames carry
    // the old branch — so say the quiet part out loud rather than letting an
    // offline flash quietly use the previous branch's images.
    setStatus('branch set — press Update firmware to cache the new branch build');
  } catch (e) { setStatus('could not set the branch: ' + e.message, true); }
  $('br-save').disabled = false;
  checkBranches();
  checkFw();
};

// Which build this is. Shown because a frozen app is copied around by hand and a
// stale one behaves like the code that built it, with nothing on screen to say so
// — which has already cost a "the UI change is missing" that was simply an old exe.
(async () => {
  try {
    const v = await api('/_api/version');
    const bits = [v.commit, v.built].filter(Boolean).join(', ');
    $('appver').textContent = '· v' + v.version + (bits ? ` (${bits})` : '');
  } catch (_) {}
})();

$('showlog').onclick = async () => {
  const pre = $('logtail');
  if (pre.style.display !== 'none') { pre.style.display = 'none'; $('showlog').textContent = 'Show log'; return; }
  try {
    const l = await api('/_api/log');
    pre.textContent = l.tail || '(empty)';
    pre.style.display = '';
    pre.scrollTop = pre.scrollHeight;
    $('showlog').textContent = 'Hide log';
  } catch (e) { setStatus('could not read the log: ' + e.message, true); }
};

$('rescan').onclick = () => { scan(); checkUi(); checkFw(); checkLog(); };
$('update').onclick = async () => {
  $('update').disabled = true;
  setStatus('downloading the latest config tool and Wizard…');
  try {
    // No ?tool=, so the host updates both. Each is its own atomic swap, so a
    // partial result is real and reported: r.version and r.wcbVersion say what
    // actually landed even when the overall run failed.
    const r = await api('/_api/update-webui', {method: 'POST'});
    const got = [r.version && `config tool ${r.version}`,
                 r.wcbVersion && `Wizard ${r.wcbVersion}`].filter(Boolean).join(', ');
    setStatus(r.ok ? (got ? 'updated — ' + got : 'updated')
                   : ((r.error || 'update failed') + (got ? ` (now: ${got})` : '')), !r.ok);
  } catch (e) { setStatus('update failed: ' + e.message, true); }
  $('update').disabled = false;
  checkUi();
};

// If something is already attached, this is a "change connection" visit rather
// than a first run — so offer a way out that does not require picking again.
// Without it, opening the chooser to look at options would strand you here.
async function showBackIfConnected() {
  try {
    const st = await api('/_api/status');
    if (st.attached) {
      $('back').style.display = '';
      $('back').onclick = openTools;
      setStatus('currently on ' + st.target + ' — pick another, or go back');
    }
  } catch (e) { /* nothing attached, or the host is starting: leave it hidden */ }
}

$('back').onclick = openTools;

// THE CHOOSER MUST NOT BE A DEAD END.
//
// With no droid on the WiFi and no cable plugged in, both lists come back empty
// and there was no way past this screen at all -- the tool could not be opened to
// look at a panel, load a saved config, or edit one for later. It does not need a
// board for any of that; it is the same page the published site serves before you
// press Connect.
//
// Nothing is attached, so the shim's autoConnect() sees st.attached === false and
// deliberately does nothing, and watchLink() likewise stays quiet. The tool comes
// up disconnected, which is exactly right. Come back here from the status line
// when a droid is available.
$('offline').onclick = openTools;

// If a scan finds nothing, point at that button rather than leaving the user
// staring at two empty lists wondering whether the app is broken.
function offerOfflineIfEmpty() {
  const noWifi = !$('wifi').querySelector('.row');
  const noSer  = !$('serial').querySelector('.row');
  if (noWifi && noSer) {
    setStatus('No droid found. You can still open the tool on its own — '
            + 'panels, saved configs and editing all work without a board.');
  }
}

scan();
checkUi();
showBackIfConnected();
</script>
