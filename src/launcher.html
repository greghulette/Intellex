<!doctype html>
<meta charset="utf-8">
<title>NaviLink</title>
<style>
  :root { color-scheme: dark; --bg:#12131a; --panel:#1b1d27; --line:#2c2f3d;
          --fg:#e8e8ea; --muted:#8b8fa3; --accent:#5cb0ff; --ok:#4ec9a0; --warn:#e0a458; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif; padding:22px 24px; }
  h1 { font-size:19px; margin:0 0 2px; letter-spacing:.02em; }
  h1 span { color:var(--accent); }
  .sub { color:var(--muted); font-size:12.5px; margin-bottom:18px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px;
          padding:14px 16px; margin-bottom:12px; }
  .card h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em;
             color:var(--muted); margin:0 0 10px; font-weight:600; }
  .row { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:7px;
         cursor:pointer; border:1px solid transparent; }
  .row:hover { background:#232636; border-color:var(--line); }
  .row .name { flex:1; min-width:0; }
  .row .name b { display:block; }
  .row .name small { color:var(--muted); }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--muted); flex:none; }
  .dot.up { background:var(--ok); }
  .empty { color:var(--muted); font-size:12.5px; padding:6px 10px; }
  button { font:inherit; background:#273044; color:var(--fg); border:1px solid var(--line);
           border-radius:7px; padding:7px 13px; cursor:pointer; }
  button:hover { background:#313c55; }
  button.primary { background:var(--accent); color:#0d1117; border-color:var(--accent); font-weight:600; }
  button:disabled { opacity:.5; cursor:default; }
  .bar { display:flex; gap:8px; align-items:center; }
  .bar .grow { flex:1; }
  .status { font-size:12.5px; color:var(--muted); min-height:18px; margin-top:10px; }
  .status.err { color:#e5737b; }
  .stale { color:var(--warn); }
</style>

<h1>Navi<span>Link</span></h1>
<div class="sub">Pick a droid, or a cable.</div>

<div class="card">
  <h2>Over WiFi</h2>
  <div id="wifi"><div class="empty">scanning…</div></div>
</div>

<div class="card">
  <h2>Over USB</h2>
  <div id="serial"><div class="empty">looking for ports…</div></div>
</div>

<div class="card">
  <div class="bar">
    <span class="grow" id="uiver">checking the config tool version…</span>
    <button id="update">Update tool</button>
    <button id="rescan">Rescan</button>
  </div>
</div>

<div class="status" id="status"></div>

<script>
const $ = id => document.getElementById(id);
const setStatus = (t, err) => { const s=$('status'); s.textContent=t; s.className='status'+(err?' err':''); };

async function api(path, opts) {
  const r = await fetch(path, opts);
  return r.json();
}

function row(dot, title, sub, onclick) {
  const d = document.createElement('div');
  d.className = 'row';
  d.innerHTML = `<span class="dot${dot ? ' up' : ''}"></span>
                 <span class="name"><b></b><small></small></span>`;
  d.querySelector('b').textContent = title;
  d.querySelector('small').textContent = sub;
  d.onclick = onclick;
  return d;
}

async function connect(body, label) {
  setStatus('connecting to ' + label + '…');
  const r = await api('/_api/attach', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body),
  });
  if (!r.ok) { setStatus(r.error || 'could not connect', true); return; }
  setStatus('connected — opening the config tool…');
  // Straight to the tool. The shim there auto-connects to whatever we just attached.
  location.href = '/';
}

async function scan() {
  $('wifi').innerHTML = '<div class="empty">scanning…</div>';
  $('serial').innerHTML = '<div class="empty">looking for ports…</div>';

  // Serial first — it is instant, so the window never looks frozen while the
  // network probe runs.
  try {
    const { ports } = await api('/_api/ports');
    const el = $('serial'); el.innerHTML = '';
    // A NaviCore enumerates as native USB CDC; a bridge WCB sits behind a UART
    // chip. Show everything, but say which is which rather than making the user
    // remember COM numbers.
    const likely = p => /USB Serial Device|CDC/i.test(p.description) ? 'probably a NaviCore'
                      : /CP210|CH9102|FTDI|Silicon Labs/i.test(p.description) ? 'probably a WCB bridge'
                      : p.description || '';
    if (!ports.length) el.innerHTML = '<div class="empty">no serial ports found</div>';
    for (const p of ports) {
      if (/Bluetooth/i.test(p.description)) continue;      // never the droid
      el.appendChild(row(false, p.path, likely(p),
        () => connect({kind:'serial', port:p.path}, p.path)));
    }
    if (!el.children.length) el.innerHTML = '<div class="empty">no likely ports found</div>';
  } catch (e) { $('serial').innerHTML = '<div class="empty">could not list ports</div>'; }

  try {
    const { candidates } = await api('/_api/discover');
    const el = $('wifi'); el.innerHTML = '';
    for (const c of candidates) {
      if (c.isNaviCore) {
        el.appendChild(row(true, `NaviCore at ${c.host}`,
          `${c.version} · via ${c.via}`,
          () => connect({kind:'ws', host:c.host}, c.host)));
      } else {
        // Say what is actually wrong. "Not found" sends people to check the droid
        // when the real problem is usually this machine's adapter.
        const d = document.createElement('div');
        d.className = 'empty';
        d.textContent = c.hint;
        el.appendChild(d);
      }
    }
    if (!el.children.length) el.innerHTML = '<div class="empty">no droid found</div>';
  } catch (e) { $('wifi').innerHTML = '<div class="empty">scan failed</div>'; }
}

async function checkUi() {
  try {
    const v = await api('/_api/webui-version');
    if (!v.bundled) { $('uiver').textContent = 'no config tool bundled'; return; }
    if (!v.checked)  { $('uiver').textContent = `config tool ${v.bundled} (offline — cannot compare)`; return; }
    if (v.stale) {
      $('uiver').innerHTML = `config tool <b>${v.bundled}</b> — <span class="stale">update available (${v.published})</span>`;
    } else {
      $('uiver').textContent = `config tool ${v.bundled} — up to date`;
    }
  } catch (e) { $('uiver').textContent = 'could not check the tool version'; }
}

$('rescan').onclick = () => { scan(); checkUi(); };
$('update').onclick = async () => {
  $('update').disabled = true;
  setStatus('downloading the latest config tool…');
  try {
    const r = await api('/_api/update-webui', {method: 'POST'});
    setStatus(r.ok ? `updated to ${r.version}` : (r.error || 'update failed'), !r.ok);
  } catch (e) { setStatus('update failed: ' + e.message, true); }
  $('update').disabled = false;
  checkUi();
};

scan();
checkUi();
</script>
