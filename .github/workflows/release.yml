# Build every Intellex platform on GitHub's machines and publish a release.
#
#   git tag v0.2.0 && git push origin v0.2.0      -> builds, then a GitHub release v0.2.0 with every file
#   Actions > Release > Run workflow               -> builds only (artifacts on the run page), no release: a test
#
# The tag must match src/version.py VERSION - the app compares itself against the tag (src/selfupdate.py), so a
# mismatch would offer every user an "update" to the version they already have, forever.
#
# What a release carries, and what src/selfupdate.py looks for by name:
#   Intellex-<v>-windows.exe        the one-file Windows app
#   Intellex-<v>-macos-x86_64.zip   Intel Mac   (ditto -c -k --keepParent: an .app keeps its symlinks)
#   Intellex-<v>-macos-arm64.zip    Apple-silicon Mac
#   Intellex-<v>-macos-<arch>.dmg   the same apps for a first install, drag to Applications
#   SHA256SUMS.txt                  every file's SHA-256; the app refuses a download that does not match
#
# Every build fetches the tools, the docs (every image, whatever its size) and the firmware as
# they are at that moment, and INTELLEX_BUILD_STRICT makes a failed fetch fail the build: an app
# is never published without them, or with yesterday's.
#
# Unsigned on both platforms (no Developer ID / code-signing certificate): a first install still needs the
# right-click > Open (macOS) or More info > Run anyway (Windows) step. An update installed by the app itself does
# not - it downloads with no quarantine flag and replaces the copy already trusted.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.v.outputs.v }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: VERSION, and the tag that must match it
        run: |
          v=$(python3 -c "import re;print(re.search(r'^VERSION = \"([^\"]+)\"', open('src/version.py').read(), re.M).group(1))")
          echo "v=$v" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$v" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match src/version.py VERSION = $v"
            exit 1
          fi

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build (scripts\build-windows.bat - the same script as on a desk)
        shell: bash
        env:
          INTELLEX_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INTELLEX_BUILD_STRICT: "1"
        run: cmd //c 'scripts\build-windows.bat' 2>&1 | tee build.log
      - name: Why the build failed (its last lines, as an annotation anyone can read)
        if: failure()
        shell: bash
        run: |
          msg=$(tail -n 40 build.log | tr -d '\r' | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=Windows build log (last 40 lines)::$msg"
      - name: Name it
        shell: bash
        run: |
          mkdir out
          cp dist/Intellex.exe "out/Intellex-${{ needs.version.outputs.v }}-windows.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*
          if-no-files-found: error

  macos:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build (scripts/build-macos.command - the same script as on a desk)
        shell: bash
        env:
          INTELLEX_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INTELLEX_BUILD_STRICT: "1"
        run: bash scripts/build-macos.command 2>&1 | tee build.log
      - name: Why the build failed (its last lines, as an annotation anyone can read)
        if: failure()
        shell: bash
        run: |
          msg=$(tail -n 40 build.log | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=macOS ${{ matrix.arch }} build log (last 40 lines)::$msg"
      - name: The app is the architecture it is named for
        run: |
          lipo -archs dist/Intellex.app/Contents/MacOS/Intellex
          lipo -archs dist/Intellex.app/Contents/MacOS/Intellex | grep -qw "${{ matrix.arch }}"
      - name: Name it
        run: |
          mkdir out
          v="${{ needs.version.outputs.v }}"
          ditto -c -k --keepParent dist/Intellex.app "out/Intellex-$v-macos-${{ matrix.arch }}.zip"
          cp dist/Intellex.dmg "out/Intellex-$v-macos-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  release:
    needs: [version, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        working-directory: out
        run: sha256sum Intellex-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" \
            --title "Intellex ${{ needs.version.outputs.v }}" --generate-notes
